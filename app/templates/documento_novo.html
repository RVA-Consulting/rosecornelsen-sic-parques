{% extends "base.html" %}
{% block titulo %}Incluir documento{% endblock %}
{% block conteudo %}
<div class="titulo">
  <div>
    <a class="voltar" href="{{ url_for('rotas.base') }}">‹ Voltar à base</a>
    <h1>Incluir documento na base</h1>
    <p class="sub">Cole o trecho que interessa (cláusula, artigo, resposta aprovada). Não inclua dados pessoais.</p>
  </div>
</div>
<form class="card" method="post" style="gap: 16px">
  <input type="hidden" name="csrf" value="{{ csrf() }}">
  <div class="campos">
    <div class="campo">
      <label for="d-tipo">Tipo</label>
      <select id="d-tipo" name="tipo">{% for t in tipos %}<option {% if t == dados.tipo %}selected{% endif %}>{{ t }}</option>{% endfor %}</select>
    </div>
    <div class="campo">
      <label for="d-parque">Parque</label>
      <select id="d-parque" name="parque">
        <option value="">Todos os parques</option>
        {% for p in parques %}<option {% if p == dados.parque %}selected{% endif %}>{{ p }}</option>{% endfor %}
      </select>
    </div>
  </div>
  <div class="campo"><label for="d-titulo">Título</label><input id="d-titulo" name="titulo" type="text" maxlength="160" value="{{ dados.titulo or '' }}" required></div>
  <div class="campo"><label for="d-resumo">Resumo em uma linha</label><input id="d-resumo" name="resumo" type="text" maxlength="255" value="{{ dados.resumo or '' }}" required></div>
  <div class="campo"><label for="d-conteudo">Conteúdo</label><textarea id="d-conteudo" name="conteudo" rows="10" required>{{ dados.conteudo or '' }}</textarea></div>
  <div class="acoes">
    <a class="btn btn-s" href="{{ url_for('rotas.base') }}">Cancelar</a>
    <button class="btn btn-p" type="submit">Incluir</button>
  </div>
</form>
{% endblock %}
