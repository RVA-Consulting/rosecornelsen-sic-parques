{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block pagina %}
<main class="entrar">
  <form class="card destaque" method="post">
    <img src="{{ url_for('static', filename='logo-arsesp.png') }}" alt="Arsesp">
    <h1>SIC Parques</h1>
    <p class="sub">Pedidos de informação ao cidadão · Ouvidoria e Gerência de Parques</p>
    {% for categoria, texto in get_flashed_messages(with_categories=true) %}
    <p class="msg msg-{{ categoria }}" role="{{ 'alert' if categoria == 'erro' else 'status' }}">{{ texto }}</p>
    {% endfor %}
    <input type="hidden" name="csrf" value="{{ csrf() }}">
    <div class="campo"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="username" required autofocus></div>
    <div class="campo"><label for="senha">Senha</label><input id="senha" name="senha" type="password" autocomplete="current-password" required></div>
    <button class="btn btn-p" type="submit">Entrar</button>
  </form>
</main>
{% endblock %}
